[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cinematic-workflow-toolkit"
version = "0.2.0"
description = "Open-source toolkit for structured AI cinematic workflows, scene planning, validation, continuity, and export."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "XtolNguyen" }
]
keywords = [
    "ai-video",
    "cinematic",
    "workflow",
    "prompt-engineering",
    "scene-planning",
    "filmmaking"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
