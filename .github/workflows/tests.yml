name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Run music video example
        run: python examples/music_video_project.py

      - name: Validate example JSON output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "examples/output/music_video_project.json"
          )

          assert path.exists(), (
              "Example JSON output was not created"
          )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          assert data["project"]["metadata"]["title"] == (
              "Neon Echoes"
          )

          assert data["project"]["summary"]["scene_count"] == 3

          assert (
              data["project"]["summary"][
                  "total_duration_seconds"
              ]
              == 45
          )

          results = data["workflow"]["scene_results"]

          assert len(results) == 3

          assert results[0]["valid"] is True
          assert results[1]["valid"] is True
          assert results[2]["valid"] is True

          issue_fields = {
              issue["field"]
              for issue in results[2][
                  "continuity_issues"
              ]
          }

          assert "continuity.wardrobe" in issue_fields

          print("Example JSON validation passed.")
          PY
